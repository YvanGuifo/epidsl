[project]
name = "epidsl"
version = "0.1.0"
description = "A domain-specific language for compositional epidemiological modelling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["epidemiology", "modelling", "dsl", "compartmental models", "simulation", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
authors = [
    { name = "Yvan Guifo", email = "yvanguifo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lark>=1.3.1",
    "networkx>=3.6.1",
    "numpy>=2.0",
    "pygls>=2.1.1",
    "scipy>=1.13",
]

[project.urls]
Homepage = "https://github.com/YvanGuifo/epidsl"
Repository = "https://github.com/YvanGuifo/epidsl"
Issues = "https://github.com/YvanGuifo/epidsl/issues"

[project.scripts]
epidsl = "epidsl.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "scipy-stubs>=1.17.1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "lark.*"
ignore_missing_imports = true
