[project]
name = "epidsl"
version = "0.1.0"
description = "A domain-specific language for compositional epidemiological modelling"
license = "MIT"
authors = [
    { name = "Yvan Guifo", email = "yvanguifo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lark>=1.3.1",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.scripts]
epidsl = "epidsl.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "scipy-stubs>=1.17.1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "lark.*"
ignore_missing_imports = true
